name: ${COMPOSE_PROJECT_NAME:-cognelo-instance1-sandbox}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "4"

services:
  judge0-server:
    image: ${JUDGE0_IMAGE:-judge0/judge0:1.13.1}
    privileged: true
    restart: unless-stopped
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - judge0-db
      - judge0-redis
    networks:
      sandbox:
        ipv4_address: ${JUDGE0_SERVER_CONTAINER_IP:-172.30.0.10}
    logging: *default-logging

  judge0-workers:
    image: ${JUDGE0_IMAGE:-judge0/judge0:1.13.1}
    command: ["./scripts/workers"]
    privileged: true
    restart: unless-stopped
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started
      judge0-language-config:
        condition: service_completed_successfully
    networks:
      - sandbox
    logging: *default-logging

  judge0-language-config:
    image: postgres:16.2
    restart: "no"
    env_file:
      - ./judge0.conf
    volumes:
      - ./configure-languages.sql:/configure-languages.sql:ro
    depends_on:
      - judge0-server
    networks:
      - sandbox
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        attempt=0
        until psql -h "$${POSTGRES_HOST}" -p "$${POSTGRES_PORT}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc "SELECT to_regclass('public.languages')" | grep -qx languages; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then
            echo "Judge0 languages table was not ready after 120 seconds." >&2
            exit 1
          fi
          sleep 2
        done
        psql -h "$${POSTGRES_HOST}" -p "$${POSTGRES_PORT}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -f /configure-languages.sql
    logging: *default-logging

  judge0-db:
    image: postgres:16.2
    restart: unless-stopped
    env_file:
      - ./judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data
    networks:
      - sandbox
    logging: *default-logging

  judge0-redis:
    image: redis:7.2.4
    command:
      - bash
      - -c
      - 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    restart: unless-stopped
    env_file:
      - ./judge0.conf
    networks:
      - sandbox
    logging: *default-logging

  web-design-runner:
    image: ${WEB_DESIGN_RUNNER_IMAGE:?Set WEB_DESIGN_RUNNER_IMAGE to the locally built tag}
    init: true
    user: pwuser
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp=${PLAYWRIGHT_SECCOMP_PROFILE:-./seccomp_profile.json}
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    shm_size: 1gb
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /home/pwuser:rw,nosuid,size=128m
    environment:
      PORT: 3456
      NODE_ENV: production
    networks:
      sandbox:
        ipv4_address: ${WEB_DESIGN_RUNNER_CONTAINER_IP:-172.30.0.11}
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3456/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  sandbox:
    internal: true
    ipam:
      config:
        - subnet: ${SANDBOX_DOCKER_SUBNET:-172.30.0.0/24}

volumes:
  judge0-data:
