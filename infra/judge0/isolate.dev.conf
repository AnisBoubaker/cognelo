# Isolate configuration for Cognelo's pinned Apple Silicon development image.
#
# Judge0 derives each sandbox ID from its monotonically increasing submission
# database ID. Isolate 2.x defaults to only 1,000 boxes, which makes every
# submission after ID 999 fail before the learner's source file is written.
# A large UID/GID-backed box range keeps those IDs valid for the practical
# lifetime of a local development database without pre-allocating directories.

box_root = /var/local/lib/isolate
lock_root = /run/isolate/locks
cg_root = auto:/run/isolate/cgroup

first_uid = 60000
first_gid = 60000
num_boxes = 1000000
