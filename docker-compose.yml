services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: cognelo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run local:configure first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cognelo"]
      interval: 5s
      timeout: 5s
      retries: 10

  judge0-server:
    image: cognelo-judge0-hardened
    build:
      context: .
      dockerfile: infra/production/judge0-hardened.Dockerfile
      args:
        JUDGE0_BASE_IMAGE: ${JUDGE0_IMAGE:-ghcr.io/anisboubaker/judge0-arm64:1.13.1-dev.2}
    depends_on:
      - judge0-db
      - judge0-redis
    volumes:
      - ./infra/judge0/judge0.conf:/judge0.conf:ro
      - ./infra/judge0/isolate.dev.conf:/usr/local/etc/isolate:ro
    ports:
      - "127.0.0.1:2358:2358"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  judge0-worker:
    image: cognelo-judge0-hardened
    build:
      context: .
      dockerfile: infra/production/judge0-hardened.Dockerfile
      args:
        JUDGE0_BASE_IMAGE: ${JUDGE0_IMAGE:-ghcr.io/anisboubaker/judge0-arm64:1.13.1-dev.2}
    command: ["./scripts/workers"]
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started
      judge0-language-config:
        condition: service_completed_successfully
    volumes:
      - ./infra/judge0/judge0.conf:/judge0.conf:ro
      - ./infra/judge0/isolate.dev.conf:/usr/local/etc/isolate:ro
    privileged: true
    restart: unless-stopped

  judge0-language-config:
    image: postgres:16.15-bookworm
    restart: "no"
    env_file:
      - ./infra/judge0/judge0.conf
    volumes:
      - ./infra/judge0/configure-languages.sql:/configure-languages.sql:ro
    depends_on:
      - judge0-server
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        attempt=0
        until psql -h "$${POSTGRES_HOST}" -p "$${POSTGRES_PORT}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc "SELECT to_regclass('public.languages')" | grep -qx languages; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then
            echo "Judge0 languages table was not ready after 120 seconds." >&2
            exit 1
          fi
          sleep 2
        done
        psql -h "$${POSTGRES_HOST}" -p "$${POSTGRES_PORT}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -f /configure-languages.sql

  judge0-db:
    image: postgres:16.15-bookworm
    env_file:
      - ./infra/judge0/judge0.conf
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.16-bookworm
    command: ["bash", "-c", "docker-entrypoint.sh --appendonly no --requirepass \"$${REDIS_PASSWORD}\""]
    env_file:
      - ./infra/judge0/judge0.conf
    restart: unless-stopped

  web-design-runner:
    build:
      context: .
      dockerfile: infra/production/web-design-runner.Dockerfile
    init: true
    user: pwuser
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true", "seccomp=./infra/production/playwright-seccomp.json"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    shm_size: 1gb
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /home/pwuser:rw,nosuid,size=128m
    environment:
      PORT: "3456"
      RUNNER_BIND_ADDRESS: "0.0.0.0"
      WEB_DESIGN_RUNNER_TOKEN: ${WEB_DESIGN_RUNNER_TOKEN:-}
    ports:
      - "127.0.0.1:3456:3456"
    restart: unless-stopped

volumes:
  postgres-data:
  judge0-postgres-data:
